        "400":
          description: Bad Request
          schema:
            type: string
        "422":
          description: Unprocessable Entity
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Criar endereço
      tags:
      - addresses
  /addresses/{id}:
    delete:
